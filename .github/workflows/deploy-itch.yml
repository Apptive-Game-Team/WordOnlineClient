name: Build and Deploy (Itch.io)

on:
  push:
    branches:
      - deploy

jobs:
  buildWebGL:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Docker prune
        run: docker system prune -af

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Set build defines based on branch
        id: build_defines
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "deploy" ]]; then
            echo "CUSTOM_PARAMS=-logFile -" >> $GITHUB_OUTPUT
          else
            echo "CUSTOM_PARAMS=-logFile - -customDefines DEV_BUILD" >> $GITHUB_OUTPUT
          fi

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          targetPlatform: WebGL
          customParameters: ${{ steps.build_defines.outputs.CUSTOM_PARAMS }}
      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V
      
      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
          ITCH_USER_RAW: ${{ secrets.ITCH_USER }}
          ITCH_GAME_RAW: ${{ secrets.ITCH_GAME }}
        run: |
          itch_user="${ITCH_USER_RAW#https://}"
          itch_user="${itch_user#http://}"
          itch_user="${itch_user%%\?*}"
          itch_user="${itch_user%%\#*}"
          itch_user="${itch_user%/}"

          if [[ "$itch_user" == itch.io/profile/* ]]; then
            itch_user="${itch_user#itch.io/profile/}"
          elif [[ "$itch_user" == *".itch.io"* ]]; then
            itch_user="${itch_user%%.itch.io*}"
          fi
          itch_user="${itch_user%%/*}"

          itch_game="${ITCH_GAME_RAW#https://}"
          itch_game="${itch_game#http://}"
          itch_game="${itch_game%%\?*}"
          itch_game="${itch_game%%\#*}"
          itch_game="${itch_game%/}"

          if [[ "$itch_game" == *".itch.io/"* ]]; then
            itch_game="${itch_game#*.itch.io/}"
          elif [[ "$itch_game" == */* ]]; then
            itch_game="${itch_game##*/}"
          fi
          itch_game="${itch_game%%:*}"

          if [[ -z "$itch_user" || -z "$itch_game" ]]; then
            echo "Failed to parse ITCH_USER/ITCH_GAME secrets into a valid itch.io target."
            exit 1
          fi

          ./butler push build/WebGL/WebGL "${itch_user}/${itch_game}:webgl"
